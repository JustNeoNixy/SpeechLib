name: Publish Maven repository
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Released library tag
        required: true
        default: v1.0.0
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: speechlib-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
      - run: bash gradlew build publishAllPublicationsToSiteRepository --console=plain
      - run: python tools/publish_site.py "$RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: {path: build/site}
      - uses: actions/deploy-pages@v4
        id: deployment
