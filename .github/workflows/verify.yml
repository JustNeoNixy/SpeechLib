name: Verify SpeechLib
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  library:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: build/model-source
          key: speechlib-base-d01c3014881c-vad-4cbf549b
      - run: python tools/fetch_speech_models.py
      - run: bash gradlew build '-Pnative_tests=true' '-Pspeech_model_dir=${{ github.workspace }}/build/model-source' --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: speechlib-${{ matrix.os }}
          path: build/libs/*.jar
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: speechlib-failure-${{ matrix.os }}
          path: build/test-results/test/*.xml
